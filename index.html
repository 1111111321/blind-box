<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="盲盒：一箱十二个盒子，五种稀有度，一个隐藏款。点开盒子看看今天抽到哪一件。">
  <meta name="theme-color" content="#fbfaf7">
  <title>盲盒 · 抽盒</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="draw">

  <a class="skip" href="#main">跳到主要内容</a>

  <header class="site-head">
    <div class="wrap head-inner">
      <a class="brand" href="index.html">
        <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="4" y="8" width="16" height="12" rx="2.5"></rect>
          <path d="M4 12.5h16M12 8v12"></path>
          <path d="M12 8c-1.2-2-3-3.2-4.2-2.2C6.6 6.7 8 8 12 8zM12 8c1.2-2 3-3.2 4.2-2.2C17.4 6.7 16 8 12 8z"></path>
        </svg>
        <span>盲盒</span>
      </a>

      <nav class="site-nav" aria-label="主导航">
        <ul>
          <li><a href="index.html" aria-current="page">抽盒</a></li>
          <li><a href="collection.html">收藏册</a></li>
          <li><a href="odds.html">概率</a></li>
          <li><a href="about.html">关于</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main">
    <div class="wrap">

      <section class="intro">
        <p class="eyebrow">纯前端 · 课程项目</p>
        <h1>点开一个盒子，收下一件小东西</h1>
        <p class="lede">一箱十二个盒子，五种稀有度，一个隐藏款。开过的盒子在这一箱里不会再出现，收藏进度只存在你自己的浏览器里。</p>
        <p class="stats">
          <span>已抽 <b id="statDraws">0</b> 次</span>
          <span>已集 <b id="statOwned">0/12</b></span>
          <span>保底 <b id="statPity">还差 10 抽</b></span>
        </p>
      </section>

      <section class="machine" aria-labelledby="machineTitle">
        <div class="machine-head">
          <h2 id="machineTitle">第一弹</h2>
          <span class="count">12 入</span>
          <a class="quiet-link" href="odds.html">概率</a>
        </div>

        <div class="case" id="case"></div>

        <div class="machine-foot">
          <button class="btn btn--sm" id="refillBtn" type="button" hidden>再装一箱</button>
          <p>一箱开完可以重新装一箱，收藏记录会继续累计。</p>
        </div>

        <p class="recent" id="recent"></p>
      </section>

      <p class="sr-only" id="live" aria-live="polite"></p>
    </div>
  </main>

  <footer class="site-foot">
    <div class="wrap">
      <span>© 2026 盲盒</span>
      <span>仅供娱乐，进度只保存在本机</span>
      <a href="about.html">关于本站</a>
    </div>
  </footer>

  <div class="overlay" id="overlay" hidden>
    <div class="dialog" id="reveal" role="dialog" aria-modal="true" aria-label="抽盒结果">
      <button class="dialog__close" id="revealClose" type="button" aria-label="关闭结果">×</button>
      <div id="revealGlyph"></div>
      <div class="dialog__actions">
        <button class="btn" id="acceptBtn" type="button">收下</button>
        <button class="btn btn--primary" id="againBtn" type="button">再抽一个</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
